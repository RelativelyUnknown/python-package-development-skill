[project]
name = "python-docs"
version = "0.1.0"
description = "Agent skill for writing software documentation, plus the prose linter it runs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-randomly>=3.15",
  "pytest-socket>=0.7",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[tool.uv]
package = false  # scripts and skills, not an installable distribution

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
extend-select = [
  "E722", "BLE", "S", "B", "PGH", "RUF100", "ERA", "T20", "FIX", "PT", "FBT",
  "ANN401", "G", "ASYNC", "SIM", "RET", "PIE", "TRY300", "TRY400", "ARG001", "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the test idiom

[tool.mypy]
python_version = "3.12"
strict = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib --disable-socket --timeout=10"
pythonpath = ["scripts"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
